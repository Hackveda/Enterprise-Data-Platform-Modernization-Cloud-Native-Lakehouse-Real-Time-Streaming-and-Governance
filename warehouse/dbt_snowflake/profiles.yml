enterprise_platform_snowflake:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'PLATFORM_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ENTERPRISE_PLATFORM') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'PLATFORM_WH') }}"
      schema: STAGING
      threads: 4
      client_session_keep_alive: false
